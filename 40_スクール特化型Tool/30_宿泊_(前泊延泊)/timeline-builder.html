<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿泊プラン タイムライン ジェネレーター</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap');

:root {
  --bg:       #0c0e14;
  --surface:  #13151f;
  --surface2: #1a1d2a;
  --border:   #252836;
  --border2:  #31354a;
  --text:     #dde1f0;
  --muted:    #5a607a;
  --muted2:   #8890aa;
  --accent:   #7c6fff;
  --lec:      #4db8ff;
  --success:  #3ecf8e;
  --danger:   #ff6b6b;
  --warn:     #ffc107;

  --c0: #a78bfa;
  --c1: #34d399;
  --c2: #f472b6;
  --c3: #fb923c;
  --c4: #facc15;
  --c5: #38bdf8;
  --c6: #f87171;
  --c7: #a3e635;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
header {
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  z-index: 10;
  flex-shrink: 0;
}

.btn-hamburger {
  width: 36px; height: 36px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 5px;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color 0.15s;
}
.btn-hamburger:hover { border-color: var(--accent); }
.btn-hamburger span {
  display: block;
  width: 16px; height: 1.5px;
  background: var(--muted2);
  border-radius: 2px;
  transition: all 0.25s;
}
.btn-hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.btn-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.btn-hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.header-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
header p  { font-size: 11px; color: var(--muted2); font-family: 'DM Mono', monospace; margin-top: 2px; }

/* ── SIDEBAR（ドロワー） ── */
#sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 49;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
#sidebar-overlay.open {
  opacity: 1;
  pointer-events: all;
}

#sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 380px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 20px 40px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
  z-index: 50;
  transform: translateX(-100%);
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 4px 0 32px rgba(0,0,0,0.5);
}
#sidebar.open {
  transform: translateX(0);
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
.btn-close-sidebar {
  width: 28px; height: 28px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--muted2);
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.btn-close-sidebar:hover { border-color: var(--danger); color: var(--danger); }

.section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.section-title::before {
  content: '';
  display: block;
  width: 3px; height: 12px;
  background: var(--accent);
  border-radius: 2px;
}

/* JSON editor */
.json-editor {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 10px;
  overflow: hidden;
}

.json-editor-header {
  padding: 8px 12px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  color: var(--muted2);
}

textarea.json-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--success);
  font-family: 'DM Mono', monospace;
  font-size: 11.5px;
  line-height: 1.7;
  padding: 12px;
  resize: vertical;
  min-height: 160px;
}

.json-status {
  padding: 6px 12px;
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  border-top: 1px solid var(--border);
}
.json-status.ok    { color: var(--success); }
.json-status.error { color: var(--danger); }

/* Plan rows */
.plan-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.plan-entry {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 28px 1fr auto auto auto;
  align-items: center;
  gap: 8px;
  transition: border-color 0.15s;
}

.plan-entry:hover { border-color: var(--border2); }

.plan-badge {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  color: #0c0e14;
  flex-shrink: 0;
}

.plan-entry-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.spin-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.spin-label {
  font-size: 9px;
  font-family: 'DM Mono', monospace;
  color: var(--muted);
  text-align: center;
}

.spin-input {
  width: 48px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  padding: 3px 4px;
  outline: none;
  -moz-appearance: textfield;
}
.spin-input::-webkit-outer-spin-button,
.spin-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.spin-input:focus { border-color: var(--accent); }

.plan-type-badge {
  font-size: 9px;
  font-family: 'DM Mono', monospace;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid currentColor;
  white-space: nowrap;
}

.btn-remove {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color 0.15s;
}
.btn-remove:hover { color: var(--danger); }

/* Add plan button */
.btn-add {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 9px;
  background: transparent;
  border: 1px dashed var(--border2);
  border-radius: 10px;
  color: var(--muted2);
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-add:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(124,111,255,0.06);
}

/* Daytrip toggle */
.daytrip-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}

.toggle {
  position: relative;
  width: 32px; height: 18px;
  flex-shrink: 0;
}
.toggle input { display: none; }
.toggle-track {
  position: absolute; inset: 0;
  background: var(--border2);
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle input:checked + .toggle-track { background: var(--accent); }
.toggle-thumb {
  position: absolute;
  top: 3px; left: 3px;
  width: 12px; height: 12px;
  background: white;
  border-radius: 50%;
  transition: left 0.2s;
  pointer-events: none;
}
.toggle input:checked ~ .toggle-thumb { left: 17px; }

.toggle-label {
  font-size: 11px;
  color: var(--muted2);
}

/* Name input */
.name-input {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  padding: 3px 7px;
  outline: none;
  width: 100%;
}
.name-input:focus { border-color: var(--accent); }

/* ── CHART AREA ── */
#chart-area {
  flex: 1;
  padding: 24px 28px 48px;
  overflow-x: auto;
  overflow-y: auto;
}

.chart-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 28px 36px;
  min-width: 500px;
}

/* Date header */
.date-row {
  display: flex;
  margin-bottom: 6px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.row-label-col {
  flex-shrink: 0;
  width: var(--label-w, 180px);
}

.dates-col {
  flex: 1;
  display: flex;
}

.date-cell {
  flex: 1;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
  position: relative;
}

.date-cell.is-lecture {
  color: var(--lec);
  font-weight: 600;
}

.date-cell.is-lecture::after {
  content: '▼';
  position: absolute;
  bottom: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 7px;
  color: var(--lec);
  opacity: 0.6;
}

/* Chart rows */
.chart-row {
  display: flex;
  align-items: center;
  min-height: 38px;
  position: relative;
}

.row-label {
  flex-shrink: 0;
  width: var(--label-w, 180px);
  display: flex;
  align-items: center;
  gap: 7px;
  padding-right: 12px;
}

.row-badge {
  width: 22px; height: 22px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  color: #0c0e14;
  flex-shrink: 0;
}

.row-name {
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row-tag {
  font-size: 9px;
  font-family: 'DM Mono', monospace;
  color: var(--muted2);
  white-space: nowrap;
}

.bar-col {
  flex: 1;
  position: relative;
  height: 38px;
}

/* Vgrid lines */
.vgrid {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  pointer-events: none;
}
.vgrid-line {
  flex: 1;
  border-right: 1px dashed rgba(255,255,255,0.04);
}
.vgrid-line.is-lecture {
  border-right-color: rgba(77,184,255,0.12);
  background: rgba(77,184,255,0.02);
}

/* Bar */
.bar {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  height: 22px;
  border-radius: 6px;
  overflow: visible;
}
.bar-fill {
  position: absolute; inset: 0;
  border-radius: 6px;
  opacity: 0.2;
}
.bar-stroke {
  position: absolute; inset: 0;
  border-radius: 6px;
  border: 1.5px solid currentColor;
}
.bar-ghost {
  position: absolute;
  top: 3px; bottom: 3px;
  border-radius: 4px;
  border: 1px dashed rgba(255,255,255,0.15);
  pointer-events: none;
}
.bar-arrow {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  font-size: 11px;
  z-index: 3;
  opacity: 1;
  text-shadow: 0 0 6px currentColor;
}
.bar-date-labels {
  position: absolute;
  bottom: -19px; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  font-weight: 600;
  font-family: 'DM Mono', monospace;
  opacity: 1;
  white-space: nowrap;
}

/* 標準プランの縦線 */
.std-vline {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--c0);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.std-vline::before {
  content: attr(data-label);
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-family: 'DM Mono', monospace;
  color: var(--c0);
  opacity: 0.8;
  white-space: nowrap;
}

/* Daytrip marker */
.daytrip-marker {
  position: absolute;
  top: 50%; transform: translate(-50%, -50%) rotate(45deg);
  width: 16px; height: 16px;
  border-radius: 3px;
}
.daytrip-label {
  position: absolute;
  top: calc(50% + 14px);
  transform: translateX(-50%);
  font-size: 9px;
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
  opacity: 0.7;
}

/* Lecture row */
.lec-dots-row {
  position: relative;
  height: 32px;
  flex: 1;
}
.lec-line {
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(77,184,255,0.3), transparent);
}
.lec-dot-wrap {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.lec-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--lec);
  box-shadow: 0 0 8px rgba(77,184,255,0.8);
}

/* Divider */
.chart-divider {
  height: 1px;
  background: var(--border);
  margin: 8px 0 10px;
}

/* Spacer row */
.row-spacer { height: 24px; }

/* Legend */
.legend {
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 10px 20px;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10.5px;
  color: var(--muted2);
}
.leg-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.leg-bar {
  width: 20px; height: 7px;
  border-radius: 3px;
  opacity: 0.6;
  flex-shrink: 0;
}
.leg-diamond {
  width: 9px; height: 9px;
  border-radius: 2px;
  rotate: 45deg;
  flex-shrink: 0;
}
.leg-ghost {
  width: 20px; height: 7px;
  border-radius: 3px;
  border: 1px dashed rgba(255,255,255,0.25);
  flex-shrink: 0;
}

/* Import / Export buttons */
.btn-icon {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--muted2);
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  padding: 3px 8px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-icon:hover { border-color: var(--accent); color: var(--accent); }
.btn-icon-export:hover { border-color: var(--success); color: var(--success); }

/* CSV button */
.btn-csv {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  letter-spacing: 0.04em;
  border: 1.5px solid transparent;
}
.btn-csv:active { transform: scale(0.97); }
.btn-csv-schedule {
  background: rgba(77,184,255,0.1);
  border-color: var(--lec);
  color: var(--lec);
}
.btn-csv-schedule:hover {
  background: rgba(77,184,255,0.2);
  box-shadow: 0 0 12px rgba(77,184,255,0.25);
}
.btn-csv-plans {
  background: rgba(62,207,142,0.1);
  border-color: var(--success);
  color: var(--success);
}
.btn-csv-plans:hover {
  background: rgba(62,207,142,0.2);
  box-shadow: 0 0 12px rgba(62,207,142,0.25);
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <button class="btn-hamburger" id="btn-hamburger" title="設定を開く">
    <span></span><span></span><span></span>
  </button>
  <div class="header-icon">📅</div>
  <div>
    <h1>宿泊プラン タイムライン ジェネレーター</h1>
    <p>日程・プラン設定 → 自動描画</p>
  </div>
  <div style="margin-left:auto;display:flex;gap:8px;">
    <button class="btn-csv btn-csv-schedule" id="btn-csv-schedule">⬇ 日程CSV</button>
    <button class="btn-csv btn-csv-plans" id="btn-csv-plans">⬇ プランCSV</button>
  </div>
</header>

<!-- OVERLAY -->
<div id="sidebar-overlay"></div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">⚙ 設定</span>
    <button class="btn-close-sidebar" id="btn-close-sidebar">✕</button>
  </div>

  <!-- 日程設定JSON -->
  <div>
    <div class="section-title" style="display:flex;align-items:center;">
      日程設定
      <span style="margin-left:auto;display:flex;gap:6px;">
        <button class="btn-icon" id="btn-schedule-import">↓ 適用</button>
        <button class="btn-icon btn-icon-export" id="btn-schedule-export">↑ 書き出し</button>
      </span>
    </div>
    <div class="json-editor">
      <div class="json-editor-header">
        <span>日程設定.json</span>
        <span id="json-date-range" style="color:var(--lec)"></span>
      </div>
      <textarea class="json-input" id="json-schedule" spellcheck="false">{
  "timeline": {
    "start": "2/13",
    "end": "2/22"
  },
  "lectures": ["2/16", "2/20"]
}</textarea>
      <div class="json-status ok" id="json-schedule-status">✓ valid</div>
    </div>
    <div id="copy-toast-schedule" style="display:none;margin-top:6px;padding:6px 10px;background:var(--lec);color:#0c0e14;border-radius:6px;font-size:11px;font-family:'DM Mono',monospace;text-align:center;">✓ コピーしました</div>
  </div>

  <!-- プラン設定JSON -->
  <div>
    <div class="section-title" style="display:flex;align-items:center;">
      プラン設定
      <span style="margin-left:auto;display:flex;gap:6px;">
        <button class="btn-icon" id="btn-plans-import">↓ 適用</button>
        <button class="btn-icon btn-icon-export" id="btn-plans-export">↑ 書き出し</button>
      </span>
    </div>
    <div class="json-editor">
      <div class="json-editor-header">
        <span>プラン設定.json</span>
      </div>
      <textarea class="json-input" id="json-plans" spellcheck="false">[
  { "name": "前泊 +2",  "early":  2, "late":  0, "daytrip": false },
  { "name": "延泊 +2",  "early":  0, "late":  2, "daytrip": false },
  { "name": "前泊 −1",  "early": -1, "late":  0, "daytrip": false },
  { "name": "延泊 −1",  "early":  0, "late": -1, "daytrip": false },
  { "name": "複合",     "early":  2, "late": -3, "daytrip": false },
  { "name": "日帰り",   "early":  2, "late": -3, "daytrip": true  }
]</textarea>
      <div class="json-status ok" id="json-plans-status">✓ valid</div>
    </div>
    <div id="copy-toast-plans" style="display:none;margin-top:6px;padding:6px 10px;background:var(--success);color:#0c0e14;border-radius:6px;font-size:11px;font-family:'DM Mono',monospace;text-align:center;">✓ コピーしました</div>
  </div>

  <!-- プラン一覧 -->
  <div>
    <div class="section-title">カスタムプラン</div>
    <div class="plan-list" id="plan-list"></div>
    <button class="btn-add" id="btn-add-plan" style="margin-top:8px">
      ＋ プランを追加
    </button>
  </div>

</div>

<!-- CHART -->
<div id="chart-area">
  <div class="chart-wrap" id="chart"></div>
</div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const COLORS = ['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
const LABEL_W = 188;

let config = {
  timeline: { start: '2/13', end: '2/22' },
  lectures: ['2/16', '2/20']
};

let customPlans = [
  { id:1, name:'前泊 +2',  early: 2, late: 0, daytrip: false },
  { id:2, name:'延泊 +2',  early: 0, late: 2, daytrip: false },
  { id:3, name:'前泊 −1',  early:-1, late: 0, daytrip: false },
  { id:4, name:'延泊 −1',  early: 0, late:-1, daytrip: false },
  { id:5, name:'複合',     early: 2, late:-3, daytrip: false },
  { id:6, name:'日帰り',   early: 2, late:-3, daytrip: true  },
];
let nextId = 7;

// ─────────────────────────────────────────────
// DATE UTILS
// ─────────────────────────────────────────────
function parseDate(str) {
  // "M/D" → {m, d}
  const [m, d] = str.split('/').map(Number);
  return { m, d };
}

function dateToVal(str) {
  const { m, d } = parseDate(str);
  return m * 100 + d;
}

function addDays(str, n) {
  // Only works within same month for simplicity; extend if needed
  const { m, d } = parseDate(str);
  const base = new Date(2025, m - 1, d);
  base.setDate(base.getDate() + n);
  return `${base.getMonth()+1}/${base.getDate()}`;
}

function getAllDates(start, end) {
  const dates = [];
  const { m: sm, d: sd } = parseDate(start);
  const { m: em, d: ed } = parseDate(end);
  let cur = new Date(2025, sm - 1, sd);
  const endD = new Date(2025, em - 1, ed);
  while (cur <= endD) {
    dates.push(`${cur.getMonth()+1}/${cur.getDate()}`);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

function clamp(date, start, end) {
  const v = dateToVal(date);
  if (v < dateToVal(start)) return start;
  if (v > dateToVal(end))   return end;
  return date;
}

// ─────────────────────────────────────────────
// DERIVE STANDARD PLAN from lectures
// ─────────────────────────────────────────────
function getStandard() {
  if (!config.lectures || config.lectures.length === 0) return null;
  const sorted = [...config.lectures].sort((a,b) => dateToVal(a) - dateToVal(b));
  const firstLec = sorted[0];
  const lastLec  = sorted[sorted.length - 1];
  const baseIn   = addDays(firstLec, -1); // 講義初日の前日
  const baseOut  = lastLec;               // 講義最終日当日
  return { baseIn, baseOut };
}

// ─────────────────────────────────────────────
// PLAN DATE COMPUTATION
// ─────────────────────────────────────────────
function computePlanDates(plan, std) {
  if (plan.daytrip) {
    const startDate = clamp(addDays(std.baseIn, -plan.early), config.timeline.start, config.timeline.end);
    return { startDate, endDate: startDate };
  }
  return {
    startDate: clamp(addDays(std.baseIn,  -plan.early), config.timeline.start, config.timeline.end),
    endDate:   clamp(addDays(std.baseOut,  plan.late),  config.timeline.start, config.timeline.end),
  };
}

// ─────────────────────────────────────────────
// JSON EDITOR — 日程設定 / プラン設定 分離
// ─────────────────────────────────────────────
const scheduleTextarea = document.getElementById('json-schedule');
const scheduleStatus   = document.getElementById('json-schedule-status');
const jsonRange        = document.getElementById('json-date-range');
const plansTextarea    = document.getElementById('json-plans');
const plansStatus      = document.getElementById('json-plans-status');

function showToast(id, color) {
  const t = document.getElementById(id);
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

// ── 日程設定パース ──
function parseSchedule() {
  try {
    const parsed = JSON.parse(scheduleTextarea.value);
    if (!parsed.timeline?.start || !parsed.timeline?.end) throw new Error('timeline.start / end が必要です');
    if (!Array.isArray(parsed.lectures) || parsed.lectures.length === 0) throw new Error('lectures 配列が必要です');
    config = { timeline: parsed.timeline, lectures: parsed.lectures };
    scheduleStatus.textContent = '✓ valid';
    scheduleStatus.className = 'json-status ok';
    jsonRange.textContent = `${config.timeline.start} → ${config.timeline.end}`;
    render();
  } catch(e) {
    scheduleStatus.textContent = '✗ ' + e.message;
    scheduleStatus.className = 'json-status error';
  }
}

// ── プラン設定パース ──
function parsePlans(apply) {
  try {
    const parsed = JSON.parse(plansTextarea.value);
    if (!Array.isArray(parsed)) throw new Error('配列形式で入力してください');
    plansStatus.textContent = '✓ valid';
    plansStatus.className = 'json-status ok';
    if (apply) {
      updatePlans(() => {
        customPlans = parsed.map((p, i) => ({
          id: nextId++,
          name:    p.name    ?? `プラン ${i + 2}`,
          early:   p.early   ?? 0,
          late:    p.late    ?? 0,
          daytrip: p.daytrip ?? false,
        }));
      });
    }
  } catch(e) {
    plansStatus.textContent = '✗ ' + e.message;
    plansStatus.className = 'json-status error';
  }
}

// タイピングでリアルタイム反映
scheduleTextarea.addEventListener('input', parseSchedule);
plansTextarea.addEventListener('input', () => parsePlans(false));

// 適用ボタン
document.getElementById('btn-schedule-import').addEventListener('click', parseSchedule);
document.getElementById('btn-plans-import').addEventListener('click', () => parsePlans(true));

// 書き出しボタン
document.getElementById('btn-schedule-export').addEventListener('click', () => {
  const out = JSON.stringify({ timeline: config.timeline, lectures: config.lectures }, null, 2);
  scheduleTextarea.value = out;
  scheduleStatus.textContent = '✓ 書き出し済み';
  scheduleStatus.className = 'json-status ok';
  navigator.clipboard.writeText(out).then(() => showToast('copy-toast-schedule')).catch(()=>{});
});

document.getElementById('btn-plans-export').addEventListener('click', () => {
  const out = JSON.stringify(customPlans.map(p => ({
    name: p.name, early: p.early, late: p.late, daytrip: p.daytrip
  })), null, 2);
  plansTextarea.value = out;
  plansStatus.textContent = '✓ 書き出し済み';
  plansStatus.className = 'json-status ok';
  navigator.clipboard.writeText(out).then(() => showToast('copy-toast-plans')).catch(()=>{});
});

// 初回パース用（後方互換）
function parseJSON(applyPlans) {
  parseSchedule();
  if (applyPlans) parsePlans(true);
}

// ─────────────────────────────────────────────
// SIDEBAR PLAN LIST
// ─────────────────────────────────────────────
function updatePlans(mutateFn) {
  mutateFn();
  renderSidebar();
  render();
}

function renderSidebar() {
  const list = document.getElementById('plan-list');
  list.innerHTML = '';

  customPlans.forEach((plan, i) => {
    const color = COLORS[(i + 1) % COLORS.length]; // +1 because ① is index 0
    const entry = document.createElement('div');
    entry.className = 'plan-entry';

    // badge
    const badge = document.createElement('div');
    badge.className = 'plan-badge';
    badge.style.background = color;
    badge.textContent = `${numToCircle(i + 2)}`;
    entry.appendChild(badge);

    // name col
    const nameCol = document.createElement('div');
    nameCol.style.cssText = 'display:flex;flex-direction:column;gap:4px;overflow:hidden;';

    const nameInput = document.createElement('input');
    nameInput.className = 'name-input';
    nameInput.value = plan.name;
    nameInput.addEventListener('input', e => { plan.name = e.target.value; render(); });

    // daytrip toggle
    const dtRow = document.createElement('div');
    dtRow.className = 'daytrip-row';
    const toggleId = `dt-${plan.id}`;
    dtRow.innerHTML = `
      <label class="toggle">
        <input type="checkbox" id="${toggleId}" ${plan.daytrip ? 'checked' : ''}>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <span class="toggle-label">日帰り</span>
    `;
    dtRow.querySelector('input').addEventListener('change', e => {
      updatePlans(() => { plan.daytrip = e.target.checked; });
    });

    nameCol.appendChild(nameInput);
    nameCol.appendChild(dtRow);
    entry.appendChild(nameCol);

    if (!plan.daytrip) {
      // early spin
      const earlyGroup = makeSpinGroup('前泊', plan.early, v => { plan.early = v; render(); }, color);
      const lateGroup  = makeSpinGroup('延泊', plan.late,  v => { plan.late  = v; render(); }, color);
      entry.appendChild(earlyGroup);
      entry.appendChild(lateGroup);
    } else {
      // daytrip: just show arrival offset
      const earlyGroup = makeSpinGroup('入り', plan.early, v => { plan.early = v; render(); }, color);
      entry.appendChild(earlyGroup);
      // placeholder
      const ph = document.createElement('div'); ph.style.width='48px';
      entry.appendChild(ph);
    }

    // remove
    const btnRm = document.createElement('button');
    btnRm.className = 'btn-remove';
    btnRm.textContent = '✕';
    btnRm.title = '削除';
    btnRm.addEventListener('click', () => {
      updatePlans(() => { customPlans = customPlans.filter(p => p.id !== plan.id); });
    });
    entry.appendChild(btnRm);

    list.appendChild(entry);
  });
}

function makeSpinGroup(label, value, onChange, color) {
  const g = document.createElement('div');
  g.className = 'spin-group';

  const lbl = document.createElement('div');
  lbl.className = 'spin-label';
  lbl.textContent = label;

  const inp = document.createElement('input');
  inp.className = 'spin-input';
  inp.type = 'number';
  inp.value = value;
  inp.style.color = color;
  inp.addEventListener('input', e => onChange(parseInt(e.target.value) || 0));

  g.appendChild(lbl);
  g.appendChild(inp);
  return g;
}

function numToCircle(n) {
  const circles = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];
  return circles[n - 1] || `(${n})`;
}

document.getElementById('btn-add-plan').addEventListener('click', () => {
  updatePlans(() => {
    customPlans.push({ id: nextId++, name: `プラン ${customPlans.length + 2}`, early: 0, late: 0, daytrip: false });
  });
});

// CHART RENDER HELPERS
// ─────────────────────────────────────────────
function renderDateHeader(chart, allDates, lectures, dateToFrac, fracToPercent) {
  const dateRow = document.createElement('div');
  dateRow.className = 'date-row';
  const labelSpacer = document.createElement('div');
  labelSpacer.className = 'row-label-col';
  dateRow.appendChild(labelSpacer);

  const datesCol = document.createElement('div');
  datesCol.className = 'dates-col';
  allDates.forEach(d => {
    const cell = document.createElement('div');
    cell.className = 'date-cell' + (lectures.includes(d) ? ' is-lecture' : '');
    cell.textContent = d;
    datesCol.appendChild(cell);
  });
  dateRow.appendChild(datesCol);
  chart.appendChild(dateRow);
}

function renderLectureRow(chart, allDates, lectures, dateToFrac, fracToPercent) {
  const lecRow = document.createElement('div');
  lecRow.className = 'chart-row';
  lecRow.style.marginTop = '8px';

  const lecLabel = document.createElement('div');
  lecLabel.className = 'row-label';
  lecLabel.innerHTML = `<span style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.08em;">講義日程</span>`;
  lecRow.appendChild(lecLabel);

  const lecDots = document.createElement('div');
  lecDots.className = 'lec-dots-row';
  const lecLine = document.createElement('div');
  lecLine.className = 'lec-line';
  lecDots.appendChild(lecLine);

  allDates.forEach(d => {
    if (!lectures.includes(d)) return;
    const f = dateToFrac(d);
    const wrap = document.createElement('div');
    wrap.className = 'lec-dot-wrap';
    wrap.style.left = fracToPercent(f);
    const dot = document.createElement('div');
    dot.className = 'lec-dot';
    wrap.appendChild(dot);
    lecDots.appendChild(wrap);
  });

  lecRow.appendChild(lecDots);
  chart.appendChild(lecRow);

  const divider = document.createElement('div');
  divider.className = 'chart-divider';
  chart.appendChild(divider);
}

function renderPlanRow(chart, plan, std, allDates, lectures, dateToFrac, fracToPercent, N) {
  const row = document.createElement('div');
  row.className = 'chart-row';

  // Label
  const lbl = document.createElement('div');
  lbl.className = 'row-label';
  const badge = document.createElement('div');
  badge.className = 'row-badge';
  badge.style.background = plan.color;
  badge.textContent = plan.num;
  const nameWrap = document.createElement('div');
  nameWrap.style.cssText = 'overflow:hidden;flex:1;';
  nameWrap.innerHTML = `
    <div class="row-name" style="color:${plan.color}">${plan.name}</div>
    <div class="row-tag" style="font-size:10px;color:var(--muted2);letter-spacing:0.03em;">${plan.tag}</div>
  `;
  lbl.appendChild(badge);
  lbl.appendChild(nameWrap);
  row.appendChild(lbl);

  // Bar col
  const barCol = document.createElement('div');
  barCol.className = 'bar-col';

  // vgrid
  const vg = document.createElement('div');
  vg.className = 'vgrid';
  allDates.forEach(d => {
    const ln = document.createElement('div');
    ln.className = 'vgrid-line' + (lectures.includes(d) ? ' is-lecture' : '');
    vg.appendChild(ln);
  });
  barCol.appendChild(vg);

  // 標準縦線
  const fStdIn  = dateToFrac(std.baseIn);
  const fStdOut = dateToFrac(std.baseOut);
  if (fStdIn !== null) {
    const vIn = document.createElement('div');
    vIn.className = 'std-vline';
    vIn.style.left = fracToPercent(fStdIn);
    vIn.dataset.label = std.baseIn;
    barCol.appendChild(vIn);
  }
  if (fStdOut !== null) {
    const vOut = document.createElement('div');
    vOut.className = 'std-vline';
    vOut.style.left = fracToPercent(fStdOut);
    vOut.dataset.label = std.baseOut;
    barCol.appendChild(vOut);
  }

  if (plan.daytrip) {
    const f = dateToFrac(plan.startDate);
    if (f !== null) {
      const marker = document.createElement('div');
      marker.className = 'daytrip-marker';
      marker.style.cssText = `left:${fracToPercent(f)};background:${plan.color};box-shadow:0 0 10px ${plan.color};`;
      barCol.appendChild(marker);
      const lbl2 = document.createElement('div');
      lbl2.className = 'daytrip-label';
      lbl2.style.cssText = `left:${fracToPercent(f)};color:${plan.color};`;
      lbl2.textContent = plan.startDate + '（日帰り）';
      barCol.appendChild(lbl2);
    }
  } else {
    const si = dateToFrac(plan.startDate);
    const ei = dateToFrac(plan.endDate);
    if (si !== null && ei !== null) {
      const leftPct  = si * 100;
      const rightPct = ei * 100;
      const widthPct = Math.max(rightPct - leftPct, 100/N * 0.5);

      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.cssText = `left:${leftPct.toFixed(3)}%;width:${widthPct.toFixed(3)}%;color:${plan.color};`;

      // Ghost (standard reference) for non-base plans
      if (!plan.isBase) {
        const bsi = dateToFrac(std.baseIn);
        const bei = dateToFrac(std.baseOut);
        if (bsi !== null && bei !== null) {
          const gLeft  = (bsi * 100 - leftPct).toFixed(3) + '%';
          const gWidth = ((bei - bsi) * 100).toFixed(3) + '%';
          const ghost = document.createElement('div');
          ghost.className = 'bar-ghost';
          ghost.style.cssText = `left:${gLeft};width:${gWidth};`;
          bar.appendChild(ghost);
        }
      }

      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.background = plan.color;
      bar.appendChild(fill);

      const stroke = document.createElement('div');
      stroke.className = 'bar-stroke';
      stroke.style.borderColor = plan.color;
      bar.appendChild(stroke);

      // Direction arrows
      if (!plan.isBase) {
        if (plan.early !== 0) {
          const a = document.createElement('div');
          a.className = 'bar-arrow';
          a.style.left = '3px';
          a.style.color = plan.color;
          a.textContent = plan.early > 0 ? '◀' : '▷';
          bar.appendChild(a);
        }
        if (plan.late !== 0) {
          const a = document.createElement('div');
          a.className = 'bar-arrow';
          a.style.right = '3px';
          a.style.color = plan.color;
          a.textContent = plan.late > 0 ? '▶' : '◁';
          bar.appendChild(a);
        }
      }

      const dateLabels = document.createElement('div');
      dateLabels.className = 'bar-date-labels';
      dateLabels.style.color = plan.color;
      const rightLabel = plan.startDate !== plan.endDate ? plan.endDate : '';
      dateLabels.innerHTML = `<span>${plan.startDate}</span><span>${rightLabel}</span>`;
      bar.appendChild(dateLabels);

      barCol.appendChild(bar);
    }
  }

  row.appendChild(barCol);
  chart.appendChild(row);

  const spacer = document.createElement('div');
  spacer.className = 'row-spacer';
  chart.appendChild(spacer);
}

function renderLegend(chart) {
  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = `
    <div class="leg-item"><div class="leg-dot" style="background:var(--lec);box-shadow:0 0 5px rgba(77,184,255,0.7)"></div>講義日</div>
    <div class="leg-item"><div class="leg-ghost"></div>標準期間（参照線）</div>
    <div class="leg-item"><span style="font-size:11px;margin-right:2px">◀▶</span>期間が伸びる</div>
    <div class="leg-item"><span style="font-size:11px;margin-right:2px">▷◁</span>期間が縮む</div>
    <div class="leg-item"><div class="leg-diamond" style="background:#f87171;"></div>日帰り（当日のみ）</div>
  `;
  chart.appendChild(legend);
}

// ─────────────────────────────────────────────
// CHART RENDER
// ─────────────────────────────────────────────
function render() {
  const chart = document.getElementById('chart');
  chart.innerHTML = '';
  chart.style.setProperty('--label-w', LABEL_W + 'px');

  const std = getStandard();
  if (!std) return;

  const allDates = getAllDates(config.timeline.start, config.timeline.end);
  const N = allDates.length;

  function dateToFrac(date) {
    const idx = allDates.indexOf(date);
    if (idx === -1) return null;
    return (idx + 0.5) / N;
  }
  function fracToPercent(f) { return (f * 100).toFixed(4) + '%'; }

  renderDateHeader(chart, allDates, config.lectures, dateToFrac, fracToPercent);
  renderLectureRow(chart, allDates, config.lectures, dateToFrac, fracToPercent);

  const allPlans = [
    {
      num: '①', name: '標準', color: COLORS[0],
      startDate: std.baseIn, endDate: std.baseOut,
      early: 0, late: 0, daytrip: false, isBase: true,
      tag: `${std.baseIn} → ${std.baseOut}`
    },
    ...customPlans.map((p, i) => {
      const color = COLORS[(i + 1) % COLORS.length];
      const { startDate, endDate } = computePlanDates(p, std);
      const tag = p.daytrip
        ? `入り ${p.early >= 0 ? '+' : ''}${p.early}（日帰り）`
        : `前 ${p.early === 0 ? '0' : (p.early > 0 ? `+${p.early}` : p.early)}  延 ${p.late === 0 ? '0' : (p.late > 0 ? `+${p.late}` : p.late)}`;
      return {
        num: numToCircle(i + 2),
        name: p.name,
        color,
        startDate, endDate,
        early: p.early, late: p.late,
        daytrip: p.daytrip,
        isBase: false,
        tag
      };
    })
  ];

  allPlans.forEach(plan =>
    renderPlanRow(chart, plan, std, allDates, config.lectures, dateToFrac, fracToPercent, N)
  );
  renderLegend(chart);
}

// ─────────────────────────────────────────────
// CSV ユーティリティ
// ─────────────────────────────────────────────
function nightsBetween(a, b) {
  const { m: am, d: ad } = parseDate(a);
  const { m: bm, d: bd } = parseDate(b);
  return Math.round((new Date(2025,bm-1,bd) - new Date(2025,am-1,ad)) / 86400000);
}

function downloadCsv(filename, rows) {
  const csvContent = '\uFEFF' + rows.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function q(v) { return `"${String(v).replace(/"/g, '""')}"`; }

function buildAllPlans(std) {
  return [
    { num:'①', name:'標準', early:0, late:0, daytrip:false,
      startDate:std.baseIn, endDate:std.baseOut },
    ...customPlans.map((p, i) => {
      const { startDate, endDate } = computePlanDates(p, std);
      return { num:numToCircle(i+2), name:p.name, early:p.early,
               late:p.late, daytrip:p.daytrip, startDate, endDate };
    })
  ];
}

// ── プランCSV（全プラン一覧） ──
document.getElementById('btn-csv-plans').addEventListener('click', () => {
  const std = getStandard();
  if (!std) return;
  const ts = config.timeline.start.replace('/','-');
  const te = config.timeline.end.replace('/','-');
  const allPlans = buildAllPlans(std);
  const baseNights = nightsBetween(std.baseIn, std.baseOut);

  const header = ['プラン番号','プラン名','前泊数','延泊数','日帰り',
    'チェックイン','チェックアウト','宿泊数',
    '標準比（チェックイン）','標準比（チェックアウト）','備考'].map(q).join(',');

  const dataRows = allPlans.map(p => {
    const nights  = p.daytrip ? 0 : nightsBetween(p.startDate, p.endDate);
    const inDiff  = nightsBetween(std.baseIn,  p.startDate);
    const outDiff = nightsBetween(std.baseOut, p.endDate);
    const note = p.daytrip ? '日帰り（宿泊なし）'
      : nights === baseNights ? '標準と同泊数'
      : nights > baseNights   ? `標準より${nights - baseNights}泊多い`
      :                         `標準より${baseNights - nights}泊少ない`;
    return [
      p.num, p.name,
      p.daytrip ? '-' : p.early,
      p.daytrip ? '-' : p.late,
      p.daytrip ? '○' : '',
      p.startDate, p.endDate,
      p.daytrip ? 0 : nights,
      inDiff  === 0 ? '±0' : inDiff  > 0 ? `+${inDiff}`  : inDiff,
      outDiff === 0 ? '±0' : outDiff > 0 ? `+${outDiff}` : outDiff,
      note,
    ].map(q).join(',');
  });

  const rows = [
    [q('【プラン一覧】'), q(`出力日時: ${new Date().toLocaleString('ja-JP')}`)].join(','),
    [q('タイムライン'), q(`${config.timeline.start} → ${config.timeline.end}`)].join(','),
    [q('講義日'), q(config.lectures.join(' / '))].join(','),
    '',
    header,
    ...dataRows,
  ];
  downloadCsv(`プラン一覧_${ts}_${te}.csv`, rows);
})
// ─────────────────────────────────────────────
// DRAWER
// ─────────────────────────────────────────────
const sidebar        = document.getElementById('sidebar');
const overlay        = document.getElementById('sidebar-overlay');
const btnHamburger   = document.getElementById('btn-hamburger');
const btnCloseSidebar = document.getElementById('btn-close-sidebar');

function openDrawer() {
  sidebar.classList.add('open');
  overlay.classList.add('open');
  btnHamburger.classList.add('open');
}
function closeDrawer() {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
  btnHamburger.classList.remove('open');
}

btnHamburger.addEventListener('click', () => {
  sidebar.classList.contains('open') ? closeDrawer() : openDrawer();
});
btnCloseSidebar.addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);

// ESCキーでも閉じる
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
parseJSON(true);
renderSidebar();
</script>
